<text x="215.0" y="79.0">Persiapan: abstrak skripsi + jurnal</text>
<text x="215.0" y="101.0">Metadata dan label sumber</text>
<text x="215.0" y="179.0">Bersihkan teks dan deduplikasi</text>
<text x="215.0" y="201.0">Pertahankan teks asli</text>
<text x="215.0" y="279.0">Embedding korpus</text>
<text x="215.0" y="301.0">Simpan indeks pencarian</text>
<text x="645.0" y="79.0">Dosen copas judul + abstrak</text>
<text x="645.0" y="101.0">Embedding kueri</text>
<text x="645.0" y="279.0">Retrieval kandidat terdekat</text>
<text x="645.0" y="301.0">K awal 10–20; perlu diuji</text>
<text x="645.0" y="379.0">Labeli input dan kandidat</text>
<text x="645.0" y="401.0">Masalah / objek / metode</text>
<text x="645.0" y="479.0">Bandingkan masalah dan objek</text>
<text x="645.0" y="501.0">Metode hanya informasi</text>
<text x="645.0" y="573.0">Bukti cukup: tingkat kemiripan</text>
<text x="645.0" y="595.0">Merah / oranye / hijau</text>
<text x="645.0" y="617.0">Jika tidak: bukti tidak cukup</text>
<text x="645.0" y="689.0">Penjelasan + kesimpulan</text>
<text x="645.0" y="711.0">Hanya dari kalimat berlabel</text>
<text x="645.0" y="789.0">Urutkan berdasarkan masalah–objek</text>
<text x="645.0" y="811.0">Warna, sumber, highlight, penjelasan</text>
<text x="645.0" y="895.0">Dosen memeriksa dan memutuskan</text>
<text x="215.0" y="436.0">Penilaian manusia</text>
<text x="215.0" y="458.0">• Recall@K retrieval</text>
<text x="215.0" y="480.0">• Ketepatan label aspek</text>
<text x="215.0" y="502.0">• Kalibrasi ambang tingkat</text>
<text x="215.0" y="524.0">• Dukungan bukti penjelasan</text>
<text x="215.0" y="638.0">Kalibrasi ≠ evaluasi akhir</text>
<text x="215.0" y="660.0">Warna bukan vonis kebaruan</text>
<text x="215.0" y="682.0">Hasil relatif terhadap korpus</text>
</g></svg>