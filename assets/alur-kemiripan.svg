</g><g fill="currentColor" font-family="sans-serif" font-size="16" text-anchor="middle">
<text x="215.0" y="79.0">Abstrak skripsi/TA JTI Polinema</text>
<text x="215.0" y="101.0">Identitas, judul, dan sumber</text>
<text x="215.0" y="179.0">Bersihkan teks dan deduplikasi</text>
<text x="215.0" y="201.0">Pertahankan teks asli</text>
<text x="215.0" y="279.0">Label aspek + embedding korpus</text>
<text x="215.0" y="301.0">Simpan indeks dan versi pengolahan</text>
<text x="645.0" y="79.0">Dosen menempelkan satu abstrak</text>
<text x="645.0" y="101.0">Validasi, label aspek, dan embedding</text>
<text x="645.0" y="279.0">Retrieval dari abstrak utuh</text>
<text x="645.0" y="301.0">Ambil top-N; keluarkan dokumen sendiri</text>
<text x="645.0" y="379.0">Gunakan representasi aspek</text>
<text x="645.0" y="401.0">Masalah dan objek input serta kandidat</text>
<text x="645.0" y="479.0">Reranking masalah dan objek</text>
<text x="645.0" y="501.0">Metode hanya informasi pendamping</text>
<text x="645.0" y="573.0">Kategori kandidat dan aspek</text>
<text x="645.0" y="595.0">Tinggi / sedang / rendah</text>
<text x="645.0" y="617.0">Aspek hilang: tidak teridentifikasi</text>
<text x="645.0" y="689.0">Highlight pasangan kata atau frasa</text>
<text x="645.0" y="711.0">Makna sepadan, posisi pada teks asli</text>
<text x="645.0" y="789.0">Tampilkan top-K dan kedua abstrak</text>
<text x="645.0" y="811.0">Kategori, sumber, metode, highlight</text>
<text x="645.0" y="895.0">Dosen memeriksa dan memutuskan</text>
<text x="215.0" y="436.0">Penilaian manusia</text>
<text x="215.0" y="458.0">• Ketepatan label dan retrieval</text>
<text x="215.0" y="480.0">• Perbandingan urutan A/B/C</text>
<text x="215.0" y="502.0">• Kalibrasi dan ketepatan kategori</text>
<text x="215.0" y="524.0">• Ketepatan pasangan highlight</text>
<text x="215.0" y="638.0">Kalibrasi ≠ evaluasi akhir</text>
<text x="215.0" y="660.0">Warna bukan vonis kebaruan</text>
<text x="215.0" y="682.0">Hasil relatif terhadap korpus</text>
</g></svg>