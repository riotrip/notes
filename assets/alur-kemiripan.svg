<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 945" role="img" aria-labelledby="title desc">
<title id="title">Alur sistem kemiripan abstrak</title><desc id="desc">Abstrak skripsi atau tugas akhir JTI disiapkan, dilabeli, dan disimpan sebagai embedding. Satu abstrak input memakai pengolahan yang sama. Retrieval abstrak utuh mengambil kandidat, lalu reranking masalah dan objek, kategori, dan highlight pasangan. Dosen tetap mengambil keputusan.</desc>
