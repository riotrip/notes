<title id="title">Alur sistem kemiripan abstrak</title><desc id="desc">Persiapan korpus dan input dosen bertemu pada retrieval, dilanjutkan pelabelan, perbandingan masalah dan objek, tingkat kemiripan, penjelasan, serta keputusan dosen. Penilaian manusia mengevaluasi retrieval, label, ambang, dan penjelasan.</desc>
