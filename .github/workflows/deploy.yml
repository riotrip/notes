name: Build and notify thesis

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm test
      - name: Build site
        run: pnpm build
      - name: Publish dist branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          publish_branch: dist
      - name: Notify thesis
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.THESIS_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/riotrip/thesis/dispatches \
            -d '{"event_type":"content-updated"}'
